
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リンリン（匿名） | Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Yu Gothic", "Meiryo", sans-serif;
            color: #24364b;
            background: linear-gradient(145deg, #dceeff, #f8fbff);
        }

        .container {
            max-width: 780px;
            margin: 65px auto;
            padding: 0 22px;
        }

        .hero {
            background: linear-gradient(135deg, #123e78, #3288d5);
            color: white;
            border-radius: 26px;
            padding: 50px 38px;
            box-shadow: 0 15px 35px rgba(31, 93, 160, 0.2);
            position: relative;
            overflow: hidden;
        }

        .hero::after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            right: -55px;
            top: -65px;
            border: 35px solid rgba(255,255,255,0.12);
            border-radius: 50%;
        }

        .label {
            font-size: 12px;
            letter-spacing: 2px;
            opacity: 0.85;
        }

        h1 {
            font-size: 34px;
            margin: 22px 0 12px;
        }

        .hero p {
            opacity: 0.9;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            margin-top: 25px;
        }

        .tag {
            background: rgba(255,255,255,0.18);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 30px;
            padding: 6px 15px;
            font-size: 12px;
        }

        .card {
            background: white;
            margin-top: 20px;
            padding: 28px 32px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(38, 90, 150, 0.07);
            transition: transform 0.25s, box-shadow 0.25s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 25px rgba(38, 90, 150, 0.13);
        }

        h2 {
            color: #155aab;
            font-size: 18px;
            margin: 0 0 14px;
        }

        h2 span {
            color: #9aa9bb;
            font-size: 12px;
            font-weight: normal;
            margin-left: 8px;
        }

        .card p {
            margin: 0;
            font-size: 14px;
            line-height: 2;
        }

        .bottom {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #8092a8;
            font-size: 12px;
        }

        footer {
            text-align: center;
            margin-top: 35px;
            color: #91a2b5;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 25px auto;
            }

            .hero {
                padding: 35px 25px;
            }

            h1 {
                font-size: 26px;
            }

            .card {
                padding: 24px;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <header class="hero">
            <div class="label">DESIGN A / MY PORTFOLIO</div>

            <h1>こんにちは、リンリン（匿名）です。</h1>
            <p>情報分野を勉強している大学生です。</p>

            <div class="tags">
                <span class="tag">HTML</span>
                <span class="tag">CSS</span>
                <span class="tag">Git</span>
                <span class="tag">GitHub</span>
            </div>
        </header>

        <section class="card">
            <h2>01. ABOUT ME <span>自己紹介</span></h2>
            <p>
                授業でHTMLやGitを学んでいます。
                少しずつ、自分でできることを増やしていきたいです。
            </p>
        </section>

        <section class="card">
            <h2>02. MY PROJECT <span>制作について</span></h2>
            <p>
                第6回のデザインAをアレンジしました。
                青をテーマにしたシンプルなサイトです。
            </p>
            <div class="bottom">
                <span>Small steps, new ideas.</span>
                <span>↗</span>
            </div>
        </section>

        <footer>
            © 2026 リンリン（匿名） | Design A
        </footer>

    </main>
</body>
</html>
